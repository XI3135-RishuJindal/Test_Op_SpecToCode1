name: Dependency Scanning

on:
  pull_request:
    branches:
      - main

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Dependency Review
      uses: actions/dependency-review-action@v2

  owasp-dependency-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: OWASP Dependency-Check
      uses: jeremylong/DependencyCheck@v6.5.0
      with:
        project: 'ApiGateway'
        scan: './'
        outputDirectory: './dependency-check-report'
        format: 'ALL'

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@v0.1.2
      with:
        scan-type: 'fs'
        ignore-unfixed: true

  node-audit:
    if: "contains(github.event.commits[0].added, 'package.json') || contains(github.event.commits[0].modified, 'package.json')"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Audit Node.js packages
      run: npm audit --audit-level=high

  payment-sdk-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run custom script to detect unapproved payment SDKs
      run: |
        bash ./scripts/detect-payment-sdks.sh