name: Dependency Scan (Payments)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1" # Mondays at 03:00 UTC

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-scan:
    name: Scan dependencies for payment SDKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine override label (allow-payment-sdks)
        id: override
        shell: bash
        run: |
          allow=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            labels_json='${{ toJson(github.event.pull_request.labels.*.name) }}'
            echo "PR labels: $labels_json"
            echo "$labels_json" | grep -qi '"allow-payment-sdks"' && allow=true || allow=false
          fi
          echo "allow=$allow" >> "$GITHUB_OUTPUT"
          echo "ALLOW_FAILURE=$allow" >> "$GITHUB_ENV"

      - name: Run dependency scan
        shell: pwsh
        run: |
          ./scripts/scan-dependencies.ps1 -DenylistPath ".github/dependency-rules/payment-denylist.txt" -ProjectPath "ApiGateway.csproj"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-artifacts
          if-no-files-found: warn
          retention-days: 30
          path: |
            packages.json
            scan-results.json
            .github/dependency-rules/payment-denylist.txt