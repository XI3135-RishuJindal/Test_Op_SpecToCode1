name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run lint checks
        run: |
          echo "Configure lint step for your specific language/framework."
          echo "Replace this step with the appropriate lint command (e.g., eslint, pylint, rubocop, etc.)."

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          echo "Configure unit test step for your specific language/framework."
          echo "Replace this step with the appropriate test command."
          echo "Tests should cover POST /orders input validation and sanitization scenarios:"
          echo "  - Valid order payloads"
          echo "  - Missing required fields (expect 400)"
          echo "  - Oversized strings (expect 400)"
          echo "  - Unexpected field types (expect 400)"
          echo "  - Special characters and injection strings (expect sanitization or 400)"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build project
        run: |
          echo "Configure build step for your specific language/framework."
          echo "Replace this step with the appropriate build command."

  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"