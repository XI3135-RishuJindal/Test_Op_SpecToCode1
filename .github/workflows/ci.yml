name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint (placeholder)
        run: |
          echo "No language/build tool specified in upgrade context."
          echo "Add project-specific lint command(s) here."
          exit 1

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests (placeholder)
        run: |
          echo "No language/build tool specified in upgrade context."
          echo "Add project-specific test command(s) here."
          exit 1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (placeholder)
        run: |
          echo "No language/build tool specified in upgrade context."
          echo "Add project-specific build command(s) here."
          exit 1

  sast:
    name: SAST (optional)
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SAST (placeholder)
        run: |
          echo "Optional SAST job disabled by default (if: false)."
          echo "No SAST tool specified in upgrade context."
          exit 1