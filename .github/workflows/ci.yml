name: CI — EF Core Initial Migration

on:
  push:
    branches: ["main", "master", "feature/ef-core-initial-migration"]
  pull_request:
    branches: ["main", "master"]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'YourStrong!Passw0rd' }}
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'YourStrong!Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET (latest stable)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: "**/coverage.cobertura.xml"

  ef-migration-validation:
    name: EF Core Migration Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: "YourStrong!Passw0rd"
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'YourStrong!Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=AppDb_CI;User Id=SA;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET (latest stable)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Install EF Core CLI tools
        run: dotnet tool install --global dotnet-ef

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Verify EF Core CLI version
        run: dotnet ef --version

      - name: Validate pending migrations list
        run: |
          dotnet ef migrations list \
            --project src/DataProject \
            --startup-project src/StartupProject \
            --no-build \
            --configuration Release \
            2>&1 || true
        continue-on-error: true

      - name: Build before migration apply
        run: dotnet build --configuration Release --no-restore

      - name: Apply EF Core migrations (database update)
        run: |
          dotnet ef database update \
            --project src/DataProject \
            --startup-project src/StartupProject \
            --configuration Release \
            --verbose

      - name: Generate migration SQL script (idempotent)
        run: |
          dotnet ef migrations script \
            --idempotent \
            --project src/DataProject \
            --startup-project src/StartupProject \
            --configuration Release \
            --output migration-script.sql

      - name: Upload idempotent migration SQL script
        uses: actions/upload-artifact@v4
        with:
          name: migration-sql-script
          path: migration-script.sql

      - name: Validate rollback — revert last migration
        run: |
          PREV=$(dotnet ef migrations list \
            --project src/DataProject \
            --startup-project src/StartupProject \
            --configuration Release \
            --no-build 2>/dev/null | tail -2 | head -1 | awk '{print $1}')
          if [ -n "$PREV" ] && [ "$PREV" != "InitialCreate" ]; then
            dotnet ef database update "$PREV" \
              --project src/DataProject \
              --startup-project src/StartupProject \
              --configuration Release
          else
            echo "Only one migration present; skipping rollback test."
          fi
        continue-on-error: true

  sast-security-scan:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET (latest stable)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-extended

      - name: Restore dependencies
        run: dotnet restore

      - name: Build for CodeQL analysis
        run: dotnet build --no-restore --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"