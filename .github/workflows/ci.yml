name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run Checkstyle (if present)
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew checkstyleMain || true
          elif [ -f "pom.xml" ]; then
            mvn checkstyle:check || true
          else
            echo "No supported build tool files found."
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run Unit Tests
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew test
          elif [ -f "pom.xml" ]; then
            mvn test
          else
            echo "No supported build tool files found."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew build
          elif [ -f "pom.xml" ]; then
            mvn package -DskipTests
          else
            echo "No supported build tool files found."
            exit 1
          fi

  security_scan:
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run Snyk to check for vulnerabilities (optional)
        uses: snyk/actions/maven@v3
        if: ${{ hashFiles('pom.xml') != '' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Run Snyk to check for vulnerabilities (optional)
        uses: snyk/actions/gradle@v3
        if: ${{ hashFiles('gradlew') != '' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}