name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint (best-effort)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if npm run | grep -qE ' lint'; then npm run lint; else echo "No npm lint script."; fi
          elif [ -f pnpm-lock.yaml ]; then
            if command -v pnpm >/dev/null 2>&1; then
              if pnpm run | grep -qE ' lint'; then pnpm -s lint; else echo "No pnpm lint script."; fi
            else
              echo "pnpm not available."
            fi
          elif [ -f yarn.lock ]; then
            if command -v yarn >/dev/null 2>&1; then
              if yarn run | grep -qE ' lint'; then yarn lint; else echo "No yarn lint script."; fi
            else
              echo "yarn not available."
            fi
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "Python project detected, but no lint tool specified in context; skipping."
          elif [ -f go.mod ]; then
            echo "Go project detected, but no lint tool specified in context; skipping."
          elif [ -f Cargo.toml ]; then
            echo "Rust project detected, but no lint tool specified in context; skipping."
          elif [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "JVM project detected, but no lint tool specified in context; skipping."
          else
            echo "No recognized project manifest; skipping lint."
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests (best-effort)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if npm run | grep -qE ' test'; then npm test; else echo "No npm test script."; fi
          elif [ -f pnpm-lock.yaml ]; then
            if command -v pnpm >/dev/null 2>&1; then
              if pnpm run | grep -qE ' test'; then pnpm -s test; else echo "No pnpm test script."; fi
            else
              echo "pnpm not available."
            fi
          elif [ -f yarn.lock ]; then
            if command -v yarn >/dev/null 2>&1; then
              if yarn run | grep -qE ' test'; then yarn test; else echo "No yarn test script."; fi
            else
              echo "yarn not available."
            fi
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "Python project detected, but no test tool specified in context; skipping."
          elif [ -f go.mod ]; then
            echo "Go project detected, but no test command specified in context; skipping."
          elif [ -f Cargo.toml ]; then
            echo "Rust project detected, but no test command specified in context; skipping."
          elif [ -f pom.xml ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "JVM project detected, but no test command specified in context; skipping."
          else
            echo "No recognized project manifest; skipping tests."
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (best-effort)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            if npm run | grep -qE ' build'; then npm run build; else echo "No npm build script."; fi
          elif [ -f pnpm-lock.yaml ]; then
            if command -v pnpm >/dev/null 2>&1; then
              if pnpm run | grep -qE ' build'; then pnpm -s build; else echo "No pnpm build script."; fi
            else
              echo "pnpm not available."
            fi
          elif [ -f yarn.lock ]; then
            if command -v yarn >/dev/null 2>&1; then
              if yarn run | grep -qE ' build'; then yarn build; else echo "No yarn build script."; fi
            else
              echo "yarn not available."
            fi
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "Python project detected, but no build command specified in context; skipping."
          elif [ -f go.mod ]; then
            echo "Go project detected, but no build command specified in context; skipping."
          elif [ -f Cargo.toml ]; then
            echo "Rust project detected, but no build command specified in context; skipping."
          elif [ -f pom.xml ]; then
            echo "Maven project detected, but no build command specified in context; skipping."
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "Gradle project detected, but no build command specified in context; skipping."
          else
            echo "No recognized project manifest; skipping build."
          fi

  sast:
    name: SAST (optional)
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SAST not configured
        shell: bash
        run: |
          echo "No SAST tool/version provided in upgrade context; job is a placeholder and does not run a scan."
          echo "Provide a specific SAST tool and version in context to enable this job."
          exit 0