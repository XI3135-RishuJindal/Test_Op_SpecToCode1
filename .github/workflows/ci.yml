name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-and-validate-docs:
    name: Lint and Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for .env.example existence
        run: |
          if [ ! -f ".env.example" ]; then
            echo "ERROR: .env.example is missing from the repository root."
            exit 1
          else
            echo ".env.example found."
          fi

      - name: Check for local setup documentation
        run: |
          DOC_FOUND=0
          for path in "docs/local-setup.md" "docs/setup.md" "README.md"; do
            if [ -f "$path" ]; then
              echo "Setup documentation found at: $path"
              DOC_FOUND=1
              break
            fi
          done
          if [ "$DOC_FOUND" -eq 0 ]; then
            echo "ERROR: No local setup documentation found (checked docs/local-setup.md, docs/setup.md, README.md)."
            exit 1
          fi

      - name: Validate .env.example has no real secrets (basic check)
        run: |
          # Fail if .env.example contains patterns that look like real secrets
          if grep -E '(password|secret|token|key)\s*=\s*[A-Za-z0-9+/]{16,}' .env.example --ignore-case; then
            echo "WARNING: .env.example may contain real secret values. Please replace with placeholders."
            exit 1
          else
            echo ".env.example secret placeholder check passed."
          fi

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md
            docs/**/*.md
        continue-on-error: true

      - name: Check .env.example for required documentation fields
        run: |
          echo "Checking .env.example for inline comments..."
          UNCOMMENTED=$(grep -v '^\s*#' .env.example | grep -v '^\s*$' | grep -v '=' || true)
          if [ -n "$UNCOMMENTED" ]; then
            echo "WARNING: Some lines in .env.example may be missing comments or are malformed:"
            echo "$UNCOMMENTED"
          fi
          echo ".env.example structure check complete."

  security-scan:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-validate-docs
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for secrets in documentation and config files
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true