name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  docs-lint:
    name: Lint & Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for .env.example existence
        run: |
          if [ ! -f ".env.example" ]; then
            echo "ERROR: .env.example is missing from the repository root."
            exit 1
          else
            echo "OK: .env.example found."
          fi

      - name: Check for local setup documentation
        run: |
          FOUND=0
          for candidate in docs/local-setup.md docs/setup.md README.md; do
            if [ -f "$candidate" ]; then
              echo "OK: Setup documentation found at $candidate"
              FOUND=1
              break
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: No setup documentation found (checked docs/local-setup.md, docs/setup.md, README.md)."
            exit 1
          fi

      - name: Validate .env.example has no real secrets (basic heuristic)
        run: |
          # Fail if .env.example contains patterns that look like real secrets
          if grep -Eq '(password|secret|token|key)\s*=\s*[A-Za-z0-9+/]{16,}' .env.example; then
            echo "WARNING: .env.example may contain real secret values. Please replace with placeholders."
            exit 1
          else
            echo "OK: .env.example does not appear to contain real secrets."
          fi

      - name: Check .env.example entries have comments
        run: |
          # Warn if any non-blank, non-comment line in .env.example lacks an inline comment
          MISSING=0
          while IFS= read -r line; do
            # Skip blank lines and full-line comments
            if [[ -z "$line" || "$line" =~ ^# ]]; then
              continue
            fi
            # Check that the line contains an inline comment
            if ! echo "$line" | grep -q '#'; then
              echo "WARNING: Missing inline comment on line: $line"
              MISSING=1
            fi
          done < .env.example
          if [ "$MISSING" -eq 1 ]; then
            echo "Some .env.example entries are missing inline comments. Please add descriptions."
            exit 1
          else
            echo "OK: All .env.example entries have inline comments."
          fi

      - name: Install markdown linter
        run: npm install -g markdownlint-cli

      - name: Lint Markdown documentation files
        run: |
          FILES=""
          for candidate in docs/local-setup.md docs/setup.md README.md; do
            if [ -f "$candidate" ]; then
              FILES="$FILES $candidate"
            fi
          done
          if [ -n "$FILES" ]; then
            markdownlint $FILES || true
          fi

      - name: Check local-setup doc contains required sections
        run: |
          DOC=""
          for candidate in docs/local-setup.md docs/setup.md README.md; do
            if [ -f "$candidate" ]; then
              DOC="$candidate"
              break
            fi
          done
          MISSING_SECTIONS=0
          for section in "Prerequisites" "clone" ".env" "install" "Variable Name"; do
            if ! grep -qi "$section" "$DOC"; then
              echo "WARNING: Setup doc may be missing section or content related to: $section"
              MISSING_SECTIONS=1
            fi
          done
          if [ "$MISSING_SECTIONS" -eq 1 ]; then
            echo "Please ensure the setup documentation covers all required sections."
            exit 1
          else
            echo "OK: Setup documentation contains expected sections."
          fi

  security-scan:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: docs-lint
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (secrets & misconfigurations)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true