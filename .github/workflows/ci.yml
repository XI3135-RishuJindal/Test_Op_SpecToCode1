name: CI — EF Core Initial Migration

on:
  push:
    branches: ["main", "master", "feature/ef-core-initial-migration"]
  pull_request:
    branches: ["main", "master"]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD || 'YourStrong!Passw0rd' }}
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'YourStrong!Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET (latest stable)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: "**/coverage.cobertura.xml"

  ef-migration:
    name: EF Core Migration Validation
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: "YourStrong!Passw0rd"
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'YourStrong!Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=AppDb_CI;User Id=SA;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET (latest stable)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Install EF Core CLI tools
        run: dotnet tool install --global dotnet-ef

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Verify EF Core CLI version
        run: dotnet ef --version

      - name: Validate pending migrations exist
        run: |
          MIGRATION_COUNT=$(find . -path "*/Migrations/*_InitialCreate.cs" | wc -l)
          if [ "$MIGRATION_COUNT" -eq 0 ]; then
            echo "ERROR: No InitialCreate migration file found. Run 'dotnet ef migrations add InitialCreate' locally first."
            exit 1
          fi
          echo "Found $MIGRATION_COUNT InitialCreate migration file(s)."

      - name: List all migrations
        run: dotnet ef migrations list --no-build --configuration Release
        continue-on-error: true

      - name: Apply migrations (dotnet ef database update)
        run: dotnet ef database update --no-build --configuration Release

      - name: Verify migration was applied (idempotency check)
        run: dotnet ef database update --no-build --configuration Release

      - name: Generate migration SQL script for review
        run: |
          dotnet ef migrations script --no-build --configuration Release \
            --output migration-script.sql \
            --idempotent
        continue-on-error: true

      - name: Upload migration SQL script artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-sql-script
          path: migration-script.sql
        continue-on-error: true

  sast-security-scan:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET (latest stable)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Restore dependencies
        run: dotnet restore

      - name: Build for CodeQL analysis
        run: dotnet build --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"