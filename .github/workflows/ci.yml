name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run lint
        run: echo "Run lint here"

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run unit tests
        run: echo "Run unit tests here"

  build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build project
        run: echo "Build project here"

  sast-bandit:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run Bandit
        run: bandit -r .

  detect-secrets:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install detect-secrets
        run: |
          python -m pip install detect-secrets

      - name: Scan for secrets
        run: detect-secrets scan