name: CI

on:
  push:
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - 'README*'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - 'README*'

jobs:
  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: '.markdownlint.json'
          globs: |
            **/*.md
            docs/**/*.md

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docs (mkdocs example)
        run: |
          pip install mkdocs
          mkdocs build

  test-docs:
    name: Check Onboarding Instructions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify README Exists
        run: test -f README.md

  sast:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan Documentation Files
        run: echo "No codebase detected. Skipping SAST for documentation-only changes."