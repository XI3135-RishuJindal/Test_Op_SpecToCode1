name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            python -m pip install -e ".[dev]" || python -m pip install -e .
          elif [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run lint (if configured)
        run: |
          set -e
          if python -m pip show ruff >/dev/null 2>&1; then
            ruff check .
          elif python -m pip show flake8 >/dev/null 2>&1; then
            flake8 .
          elif python -m pip show pylint >/dev/null 2>&1; then
            pylint .
          else
            echo "No known linter (ruff/flake8/pylint) installed; skipping."
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            python -m pip install -e ".[test]" || python -m pip install -e .
          elif [ -f requirements-test.txt ]; then
            python -m pip install -r requirements-test.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run unit tests (if configured)
        run: |
          set -e
          if python -m pip show pytest >/dev/null 2>&1; then
            pytest -q
          elif [ -f manage.py ]; then
            python manage.py test
          else
            echo "No known test runner (pytest) installed and no manage.py found; skipping."
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            python -m pip install build
          else
            echo "No pyproject.toml found; skipping package build."
          fi

      - name: Build distributions
        run: |
          if [ -f pyproject.toml ]; then
            python -m build
          fi

  sast:
    name: SAST (optional)
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SAST tool (optional)
        run: |
          echo "SAST job disabled by default. Enable by changing job 'if' to true and installing your chosen SAST tool."