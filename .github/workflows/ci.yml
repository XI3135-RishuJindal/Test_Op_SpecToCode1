name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install linters
        run: python -m pip install --upgrade pip flake8
      - name: Lint code
        run: flake8 .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies for SQLAlchemy 2.x
        run: |
          python -m pip install --upgrade pip
          pip install "SQLAlchemy>=2.0.0" pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run tests
        run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies for SQLAlchemy 2.x
        run: |
          python -m pip install --upgrade pip
          pip install "SQLAlchemy>=2.0.0"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Build application
        run: |
          # Put build steps here. E.g.: python setup.py sdist bdist_wheel
          echo "Build step - customize as needed for your application."

  sast:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run CodeQL Analysis (optional)
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3