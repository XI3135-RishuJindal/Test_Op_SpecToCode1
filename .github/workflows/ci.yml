name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  detect-and-build:
    name: Detect Stack, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect tech stack
        id: detect
        run: |
          echo "Detecting tech stack..."

          if [ -f "package.json" ]; then
            echo "stack=node" >> "$GITHUB_OUTPUT"
            echo "Detected: Node.js"
          elif [ -f "pom.xml" ]; then
            echo "stack=maven" >> "$GITHUB_OUTPUT"
            echo "Detected: Java/Maven"
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "stack=gradle" >> "$GITHUB_OUTPUT"
            echo "Detected: Java/Gradle"
          elif [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "requirements.txt" ]; then
            echo "stack=python" >> "$GITHUB_OUTPUT"
            echo "Detected: Python"
          elif [ -f "go.mod" ]; then
            echo "stack=go" >> "$GITHUB_OUTPUT"
            echo "Detected: Go"
          elif [ -f "Cargo.toml" ]; then
            echo "stack=rust" >> "$GITHUB_OUTPUT"
            echo "Detected: Rust"
          elif [ -f "Makefile" ]; then
            echo "stack=make" >> "$GITHUB_OUTPUT"
            echo "Detected: Makefile-based project"
          else
            echo "stack=unknown" >> "$GITHUB_OUTPUT"
            echo "WARNING: Could not detect tech stack. Please document it in docs/tech-stack.md"
          fi

      - name: Set up Node.js (if detected)
        if: steps.detect.outputs.stack == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Set up Python (if detected)
        if: steps.detect.outputs.stack == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Java (if Maven or Gradle detected)
        if: steps.detect.outputs.stack == 'maven' || steps.detect.outputs.stack == 'gradle'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go (if detected)
        if: steps.detect.outputs.stack == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Rust (if detected)
        if: steps.detect.outputs.stack == 'rust'
        uses: dtolnay/rust-toolchain@stable

      # ── Install Dependencies ──────────────────────────────────────────────

      - name: Install dependencies (Node.js)
        if: steps.detect.outputs.stack == 'node'
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Install dependencies (Python)
        if: steps.detect.outputs.stack == 'python'
        run: |
          python -m pip install --upgrade pip
          if [ -f "pyproject.toml" ]; then
            pip install ".[dev]" 2>/dev/null || pip install ".[test]" 2>/dev/null || pip install .
          elif [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Install dependencies (Maven)
        if: steps.detect.outputs.stack == 'maven'
        run: mvn --batch-mode dependency:resolve

      - name: Install dependencies (Gradle)
        if: steps.detect.outputs.stack == 'gradle'
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew dependencies --no-daemon
          else
            gradle dependencies --no-daemon
          fi

      # ── Lint ─────────────────────────────────────────────────────────────

      - name: Lint (Node.js)
        if: steps.detect.outputs.stack == 'node'
        run: |
          if node -e "require('./package.json').scripts.lint" 2>/dev/null; then
            npm run lint
          else
            echo "No lint script found in package.json — skipping"
          fi

      - name: Lint (Python)
        if: steps.detect.outputs.stack == 'python'
        run: |
          if command -v flake8 &>/dev/null; then
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          elif command -v ruff &>/dev/null; then
            ruff check .
          else
            echo "No Python linter found — skipping"
          fi

      - name: Lint (Go)
        if: steps.detect.outputs.stack == 'go'
        run: |
          if command -v golangci-lint &>/dev/null; then
            golangci-lint run
          else
            go vet ./...
          fi

      # ── Build ─────────────────────────────────────────────────────────────

      - name: Build (Node.js)
        if: steps.detect.outputs.stack == 'node'
        run: |
          if node -e "require('./package.json').scripts.build" 2>/dev/null; then
            npm run build
          else
            echo "No build script found in package.json — skipping"
          fi

      - name: Build (Python)
        if: steps.detect.outputs.stack == 'python'
        run: |
          if [ -f "pyproject.toml" ]; then
            pip install build 2>/dev/null && python -m build --no-isolation 2>/dev/null || echo "Build step skipped"
          else
            echo "No build step required for this Python project — skipping"
          fi

      - name: Build (Maven)
        if: steps.detect.outputs.stack == 'maven'
        run: mvn --batch-mode compile -DskipTests

      - name: Build (Gradle)
        if: steps.detect.outputs.stack == 'gradle'
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew build -x test --no-daemon
          else
            gradle build -x test --no-daemon
          fi

      - name: Build (Go)
        if: steps.detect.outputs.stack == 'go'
        run: go build ./...

      - name: Build (Rust)
        if: steps.detect.outputs.stack == 'rust'
        run: cargo build --release

      - name: Build (Makefile)
        if: steps.detect.outputs.stack == 'make'
        run: |
          if grep -q "^build:" Makefile; then
            make build
          else
            echo "No 'build' target in Makefile — skipping"
          fi

      # ── Test ──────────────────────────────────────────────────────────────

      - name: Test (Node.js)
        if: steps.detect.outputs.stack == 'node'
        run: npm test

      - name: Test (Python)
        if: steps.detect.outputs.stack == 'python'
        run: |
          if command -v pytest &>/dev/null; then
            pytest --tb=short
          elif command -v python &>/dev/null && python -m pytest --version &>/dev/null 2>&1; then
            python -m pytest --tb=short
          else
            echo "No test runner found — skipping"
          fi

      - name: Test (Maven)
        if: steps.detect.outputs.stack == 'maven'
        run: mvn --batch-mode test

      - name: Test (Gradle)
        if: steps.detect.outputs.stack == 'gradle'
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew test --no-daemon
          else
            gradle test --no-daemon
          fi

      - name: Test (Go)
        if: steps.detect.outputs.stack == 'go'
        run: go test ./... -v

      - name: Test (Rust)
        if: steps.detect.outputs.stack == 'rust'
        run: cargo test

      - name: Test (Makefile)
        if: steps.detect.outputs.stack == 'make'
        run: |
          if grep -q "^test:" Makefile; then
            make test
          else
            echo "No 'test' target in Makefile — skipping"
          fi

      - name: Unknown stack warning
        if: steps.detect.outputs.stack == 'unknown'
        run: |
          echo "::warning::Tech stack could not be detected automatically."
          echo "::warning::Please document your stack in docs/tech-stack.md and update this workflow."
          exit 1

  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: detect-and-build
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: auto

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:auto'