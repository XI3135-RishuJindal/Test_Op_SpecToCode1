name: CI

on:
  push:
    branches: [ "main", "master", "feature/structured-json-logging" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (latest stable)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint

      - name: Run flake8
        run: flake8 . --max-line-length=120 --exclude=.git,__pycache__,.venv,venv

      - name: Run pylint
        run: |
          pylint $(find . -name "*.py" -not -path "./.git/*" -not -path "./.venv/*" -not -path "./venv/*") \
            --disable=C0114,C0115,C0116 \
            --max-line-length=120 || true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (latest stable)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
          pip install python-json-logger>=2.0.7 pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (latest stable)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install python-json-logger>=2.0.7

      - name: Build package
        run: |
          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            python -m build
          else
            echo "No build configuration found; skipping package build."
          fi

      - name: Verify logging_config import
        run: |
          python -c "
          import importlib, sys, os
          sys.path.insert(0, '.')
          candidates = ['logging_config', 'app.logging_config']
          for mod in candidates:
              try:
                  importlib.import_module(mod)
                  print(f'Successfully imported {mod}')
              except ModuleNotFoundError:
                  print(f'Module {mod} not found (may not exist yet)')
          "

  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: [ build ]
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (latest stable)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Run Bandit SAST scan
        run: |
          bandit -r . \
            --exclude ./.git,./.venv,./venv,./tests \
            --format json \
            --output bandit-report.json \
            --severity-level medium || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: bandit-report.json