name: CI

on:
  push:
    branches: [ "main", "master", "feature/efcore-repository-migration" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: "YourStrong!Passw0rd"
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P 'YourStrong!Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ConnectionStrings__Default: "Server=localhost,1433;Database=AppDb_CI;User Id=SA;Password=YourStrong!Passw0rd;TrustServerCertificate=True;"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET (latest stable)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build (treat warnings as errors)
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Install EF Core CLI tools
        run: dotnet tool restore || dotnet tool install --global dotnet-ef

      - name: Apply EF Core migrations
        run: dotnet ef database update --no-build --configuration Release
        continue-on-error: false

      - name: Run unit & integration tests
        run: >
          dotnet test
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/**/*.trx

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: ./TestResults/**/coverage.cobertura.xml

  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET (latest stable)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build for CodeQL analysis
        run: dotnet build --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"