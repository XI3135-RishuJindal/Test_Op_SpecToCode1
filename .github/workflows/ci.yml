name: CI

on:
  push:
    branches: ["main", "master", "feature/https-healthcheck-validation"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run lint checks
        run: |
          echo "Configure lint step for your specific language/framework."
          echo "Replace this step with the appropriate linter invocation."

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          echo "Configure test step for your specific language/framework."
          echo "Replace this step with the appropriate test runner invocation."
          echo "Ensure HTTPS enforcement, health-check endpoint, and DataAnnotations validation are covered."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application
        run: |
          echo "Configure build step for your specific language/framework."
          echo "Replace this step with the appropriate build tool invocation."

      - name: Verify health-check endpoint exists
        run: |
          echo "Add a smoke-test or grep here to confirm /healthz route is present in built artifacts."

  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"