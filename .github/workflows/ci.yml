name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  IMAGE_NAME: ${{ github.repository }}
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application
        run: |
          echo "Build step — update this command for your language/build tool"
          # e.g. for Node.js: npm ci && npm run build
          # e.g. for Python:  pip install -r requirements.txt
          # e.g. for Java:    ./mvnw package -DskipTests
          # e.g. for Go:      go build ./...

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            build/
            target/
            out/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
        continue-on-error: true

      - name: Run unit tests
        run: |
          echo "Test step — update this command for your language/test framework"
          # e.g. for Node.js: npm test
          # e.g. for Python:  pytest --junitxml=test-results.xml
          # e.g. for Java:    ./mvnw test
          # e.g. for Go:      go test ./...

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            coverage/
            reports/
          if-no-files-found: ignore
          retention-days: 7

  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
          # Update the languages list to match your repository's languages.
          # Supported: c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, swift

      - name: Autobuild for CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:auto"

      - name: Run Semgrep SAST scan
        uses: returntocorp/semgrep-action@v1
        if: ${{ vars.SEMGREP_APP_TOKEN != '' }}
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    needs: container-build
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.18.0
        with:
          image-ref: ${{ needs.container-build.outputs.image-ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-scan

      - name: Run Trivy scan (table output for logs)
        uses: aquasecurity/trivy-action@0.18.0
        with:
          image-ref: ${{ needs.container-build.outputs.image-ref }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
        continue-on-error: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - sast
      - container-build
      - image-scan
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy application
        env:
          IMAGE_REF: ${{ needs.container-build.outputs.image-ref }}
          IMAGE_DIGEST: ${{ needs.container-build.outputs.image-digest }}
          DEPLOY_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
        run: |
          echo "Deploy step — update this for your deployment target"
          echo "Deploying image: $IMAGE_REF"
          echo "Image digest:    $IMAGE_DIGEST"
          echo "Target env:      $DEPLOY_ENV"
          # e.g. for Kubernetes:  kubectl set image deployment/app app=$IMAGE_REF
          # e.g. for ECS:         aws ecs update-service --cluster $CLUSTER --service $SERVICE --force-new-deployment
          # e.g. for Helm:        helm upgrade --install app ./chart --set image.tag=$IMAGE_DIGEST
          # e.g. for serverless:  serverless deploy --stage $DEPLOY_ENV