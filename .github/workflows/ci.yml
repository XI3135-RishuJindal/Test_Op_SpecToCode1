name: CI

on:
  push:
    branches: [ "main", "feature/ef-core-persistent-store" ]
  pull_request:
    branches: [ "main", "feature/ef-core-persistent-store" ]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=ci_db;Username=ci_user;Password=ci_password"
      ConnectionStrings__SQLite: "Data Source=ci_local.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (latest stable)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install dotnet-ef CLI tool
        run: dotnet tool install --global dotnet-ef

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Lint — enforce code format
        run: dotnet format --verify-no-changes --no-restore

      - name: Apply EF Core migrations (SQLite — development)
        env:
          ConnectionStrings__DefaultConnection: "Data Source=ci_local.db"
        run: |
          dotnet ef database update \
            --no-build \
            --configuration Release \
            -- --environment Development

      - name: Apply EF Core migrations (PostgreSQL — production-like)
        run: |
          dotnet ef database update \
            --no-build \
            --configuration Release \
            -- --environment Production

      - name: Run unit tests
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category!=Integration" \
            --logger "trx;LogFileName=unit-test-results.trx" \
            --results-directory ./TestResults

      - name: Run integration tests (PostgreSQL)
        run: |
          dotnet test --no-build --configuration Release \
            --filter "Category=Integration" \
            --logger "trx;LogFileName=integration-test-results.trx" \
            --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/*.trx

  sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK (latest stable)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build for CodeQL analysis
        run: dotnet build --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"