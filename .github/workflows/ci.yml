name: CI

on:
  push:
    branches: [ main, master, upgrade/sqlalchemy-2.x ]
  pull_request:
    branches: [ main, master ]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies with SQLAlchemy 2.x
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
            pip install "SQLAlchemy>=2,<3"
          elif [ -f pyproject.toml ]; then
            pip install . "SQLAlchemy>=2,<3"
          else
            pip install "SQLAlchemy>=2,<3"
          fi

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install linter
        run: pip install flake8

      - name: Lint code
        run: flake8 .

  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: pip install pytest

      - name: Install SQLAlchemy 2.x
        run: pip install "SQLAlchemy>=2,<3"

      - name: Run unit tests
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          pip install build
          pip install "SQLAlchemy>=2,<3"

      - name: Build package
        run: python -m build

  sast:
    runs-on: ubuntu-latest
    needs: setup
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Bandit
        run: pip install bandit

      - name: Run SAST scan (Bandit)
        run: bandit -r . || true