server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: registration-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:registration_db}
    username: ${DB_USERNAME:registration_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@example.com}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  verification:
    token-expiry-minutes: ${VERIFICATION_TOKEN_EXPIRY_MINUTES:1440}
  mail:
    from: ${MAIL_FROM:no-reply@example.com}
