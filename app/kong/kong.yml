_format_version: "3.0"
_transform: true

# ── Services ──────────────────────────────────────────────────────────────────
services:
  - name: api-gateway-control
    url: http://api-gateway-control:8000
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    retries: 3
    routes:
      - name: health-route
        paths:
          - /health
        methods:
          - GET
        strip_path: false
        preserve_host: true
      - name: api-routes
        paths:
          - /api
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        strip_path: false
        preserve_host: true

# ── Plugins (global) ──────────────────────────────────────────────────────────
plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-API-Key
      exposed_headers:
        - X-Request-ID
      credentials: false
      max_age: 3600

  - name: request-id
    config:
      header_name: X-Request-ID
      generator: uuid

  - name: response-ratelimiting
    config:
      limits:
        default:
          second: 100
          minute: 1000
