{
  "listen_port": 8080,
  "secret": "${TYK_SECRET}",
  "node_secret": "${TYK_SECRET}",
  "template_path": "/opt/tyk-gateway/templates",
  "tyk_js_path": "/opt/tyk-gateway/js/tyk.js",
  "middleware_path": "/opt/tyk-gateway/middleware",
  "use_db_app_configs": false,
  "app_path": "/opt/tyk-gateway/apps/",
  "storage": {
    "type": "memory",
    "enable_cluster": false
  },
  "enable_analytics": true,
  "analytics_config": {
    "type": "",
    "ignored_ips": []
  },
  "health_check": {
    "enable_health_checks": true,
    "health_check_value_timeouts": 60
  },
  "optimisations_use_async_session_write": true,
  "enable_key_logging": false,
  "suppress_redis_signal_reload": false,
  "hash_keys": true,
  "hash_key_function": "murmur64",
  "enable_hashed_keys_listing": false,
  "suppress_default_org_store": false,
  "use_redis_log": false,
  "sentry_code": "",
  "use_sentry": false,
  "enforce_org_data_age": false,
  "enforce_org_quotas": false,
  "experimental_process_org_off_thread": false,
  "enable_non_transactional_rate_limiter": true,
  "enable_sentinel_rate_limiter": false,
  "enable_redis_rolling_limiter": false,
  "allow_master_keys": false,
  "policies": {
    "policy_source": "file",
    "policy_record_name": "policies/policies.json"
  },
  "max_idle_connections_per_host": 500,
  "proxy_ssl_insecure_skip_verify": false,
  "proxy_default_timeout": 30,
  "proxy_ssl_min_version": 771,
  "proxy_ssl_ciphers": [],
  "enable_bundle_downloader": false,
  "bundle_base_url": "",
  "global_session_lifetime": 100,
  "force_global_session_lifetime": false,
  "hide_generator_header": false,
  "event_handlers": {
    "events": {}
  },
  "http_server_options": {
    "enable_websockets": true,
    "use_ssl": false,
    "server_name": "",
    "min_version": 771,
    "certificates": []
  },
  "monitor": {
    "enable_trigger_monitors": false,
    "data_expiry": 100,
    "monitor_period": 2,
    "monitor_url": "",
    "monitor_user_keys": false,
    "global_trigger_limit": 80.0,
    "header_map": {}
  },
  "oauth_refresh_token_expire": 1209600,
  "oauth_token_expire": 3600,
  "oauth_token_expired_retain_period": 0,
  "oauth_redirect_uri_separator": ";",
  "oauth_error_status_code": 403,
  "version_header": "x-api-version",
  "enable_ip_whitelisting": false,
  "enable_ip_blacklisting": false,
  "allowed_ips": [],
  "blacklisted_ips": [],
  "track_404_logs": false,
  "request_size_limit": 0,
  "response_body_size_limit": 0,
  "enable_custom_domains": false,
  "enable_jsvm": false,
  "jsvm_timeout": 5,
  "disable_virtual_path_blobs": false,
  "tyk_api_config": {
    "Host": "http://localhost",
    "Port": "8080",
    "Secret": "${TYK_SECRET}"
  },
  "coprocess_options": {
    "enable_coprocess": false,
    "coprocess_grpc_server": "",
    "grpc_recv_max_size": 0,
    "grpc_send_max_size": 0
  },
  "ignore_endpoint_case": false,
  "ignore_canonical_mime_header_key": false,
  "log_level": "info",
  "tracing": {
    "enabled": false,
    "name": "",
    "options": {}
  }
}
