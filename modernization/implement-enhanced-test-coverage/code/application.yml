# Logging configuration
LOGGING_LEVEL_ROOT=INFO
LOGGING_LEVEL_MY_APP=DEBUG
LOGGING_CONFIG=classpath:log4j2-spring.xml
# Updated Log4j version and configuration file for improved security

# Jackson configuration (default settings updated for recent version)
JACKSON_ENABLE_DEFAULT_TYPING=false
# Disabling default typing for security enhancements

# Maven properties (add this section if Maven version or dependencies are explicitly configured)
# MAVEN_VERSION=3.8.6 # Example of setting Maven version if required

# CI/CD related configuration (example placeholders for CI/CD tools)
