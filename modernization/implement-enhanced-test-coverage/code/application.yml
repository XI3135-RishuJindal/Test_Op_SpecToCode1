CI_CD_CONFIG_FILE=jenkinsfile # Jenkins Pipeline script file

# Containerization settings (examples assuming Docker setup)
CONTAINERIZATION_ENABLED=true
DOCKER_IMAGE_NAME=myapp:latest # Example Docker image name for the application deployment
DOCKERFILE_PATH=./Dockerfile # Path to the Dockerfile for building container images
