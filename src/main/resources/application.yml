spring:
  application:
    name: pharmacy-microservice

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pharmacy_db}
    username: ${DB_USERNAME:pharmacy_user}
    password: ${DB_PASSWORD:pharmacy_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.pharmacy: ${LOG_LEVEL:INFO}
    org.springframework: WARN
